name: Benchmark & CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      reps:
        description: 'Number of repetitions per config'
        required: false
        default: '5'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: |
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq strace
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          sudo sysctl -w kernel.yama.ptrace_scope=0 2>/dev/null || true

      - name: Run unit tests
        run: npm test

      - name: Lint JavaScript
        run: npm run lint

      - name: Shellcheck bash scripts
        run: shellcheck src/*.sh bench/*.sh bench/workloads/*.sh test/*.sh

      - name: Run nosync integration tests
        run: bash test/nosync_test.sh

  e2e:
    name: e2e / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Accelerate runner (overclock v2)
        uses: ./
        with:
          zram-swap: 'true'
          tmpfs-paths: '~/.cache/overclock-e2e'

      - name: Verify acceleration and telemetry
        run: |
          echo "=== Checking LD_PRELOAD in process maps ==="
          if ! grep -q libnosync /proc/self/maps; then
            echo "::error::libnosync not found in /proc/self/maps"
            exit 1
          fi

          echo "=== Checking dirty_ratio ==="
          dirty_ratio=$(cat /proc/sys/vm/dirty_ratio)
          if [ "$dirty_ratio" != "45" ]; then
            echo "::error::dirty_ratio is $dirty_ratio, expected 45"
            exit 1
          fi

          echo "=== Checking zram swap in /proc/swaps ==="
          if ! grep -q zram /proc/swaps; then
            echo "::error::zram device not found in /proc/swaps"
            exit 1
          fi

          echo "=== Checking tmpfs mount ==="
          target_dir="$HOME/.cache/overclock-e2e"
          if ! mountpoint -q "$target_dir"; then
            echo "::error::$target_dir is not a mountpoint"
            exit 1
          fi

          echo "=== Checking GIT_CONFIG_COUNT ==="
          if [ -z "${GIT_CONFIG_COUNT:-}" ] || [ "$GIT_CONFIG_COUNT" -le 0 ]; then
            echo "::error::GIT_CONFIG_COUNT is not set or <= 0 ($GIT_CONFIG_COUNT)"
            exit 1
          fi

          echo "=== Checking dpkg unsafe-io configuration ==="
          if [ ! -f /etc/dpkg/dpkg.cfg.d/overclock-unsafe-io ]; then
            echo "::error::/etc/dpkg/dpkg.cfg.d/overclock-unsafe-io not found"
            exit 1
          fi

          echo "=== Checking ASAN_OPTIONS ==="
          if [[ "${ASAN_OPTIONS:-}" != *"verify_asan_link_order=0"* ]]; then
            echo "::error::ASAN_OPTIONS does not contain verify_asan_link_order=0 ($ASAN_OPTIONS)"
            exit 1
          fi

          echo "=== Running SQLite workload to exercise fsync bypass ==="
          python3 - <<'PY'
          import os
          import sqlite3

          db_path = os.path.expanduser("~/.cache/overclock-e2e/e2e.db")
          conn = sqlite3.connect(db_path)
          conn.execute("PRAGMA journal_mode=DELETE;")
          conn.execute("PRAGMA synchronous=FULL;")
          conn.execute("CREATE TABLE bench_e2e (id INTEGER PRIMARY KEY, val TEXT);")
          conn.commit()

          for i in range(100):
              conn.execute("INSERT INTO bench_e2e (val) VALUES (?);", (f"record-{i}",))
              conn.commit()

          conn.close()
          print("SQLite e2e workload finished successfully")
          PY

  cross-platform:
    name: cross-platform / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run action (graceful no-op)
        uses: ./

      - name: Verify no-op
        shell: bash
        run: echo ok

  bench:
    name: bench / ${{ matrix.workload }} / ${{ matrix.runner }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        workload: [sqlite, smallfiles, npm-ci, pip-install, apt-reinstall, cargo-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run benchmark
        env:
          BENCH_RUNNER: ${{ matrix.runner }}
        run: |
          mkdir -p results
          reps="${{ inputs.reps || 5 }}"
          bash bench/run.sh "${{ matrix.workload }}" "$reps" "results/bench-${{ matrix.workload }}-${{ matrix.runner }}.json"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.workload }}-${{ matrix.runner }}
          path: results/*.json
          retention-days: 7

  report:
    name: Generate Benchmark Report
    needs: bench
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          merge-multiple: true
          path: results

      - name: Generate report
        run: |
          python3 bench/report.py results/*.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: bench-report.md
          retention-days: 7
