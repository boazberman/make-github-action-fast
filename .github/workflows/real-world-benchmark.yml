name: Real-world Benchmark

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reps:
        description: 'Number of repetitions per config'
        required: false
        default: '3'
        type: string
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: ${{ matrix.project }} / ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [vue-core, ripgrep, fastapi, redis]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run real-world benchmark
        env:
          BENCH_RUNNER: ubuntu-24.04
        run: |
          mkdir -p results
          reps="${{ inputs.reps || 3 }}"
          bash bench/real-world.sh "${{ matrix.project }}" "$reps" "results/rw-${{ matrix.project }}-ubuntu-24.04.json"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: rw-${{ matrix.project }}
          path: results/*.json
          retention-days: 7

  report:
    name: Generate Real-World Report
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rw-*
          merge-multiple: true
          path: results

      - name: Generate report
        run: |
          python3 bench/report.py results/*.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-world-report
          path: bench-report.md
          retention-days: 7
